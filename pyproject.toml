[project]
name = "steam-achievement-tracker"
version = "0.1.0"
description = "A small python-based dashboard to track Steam achievements."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "nicegui>=3.11.1",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "uvicorn>=0.46.0",
]

[tool.ruff]
line-length = 150

[tool.black]
line-length = 150

[tool.pylint]
max-line-length = 150
